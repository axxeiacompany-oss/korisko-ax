    <meta property="og:title" content="Korisko - Sistema de Gestão para Padaria" />
    <meta property="og:description" content="Sistema de gestão da Padaria Korisko operando exclusivamente em Guaranis (₲ PYG) com PDV ágil, controle de estoque, comandas, fornadas quentes, caixa cego e proteção de segurança blindada." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      vite-error-overlay,
      [data-vite-dev-overlay],
      #vite-error-overlay {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
      }
    </style>
    <script>
      (function() {
        // 1. Stub Vite HMR WebSocket so it never fails with "WebSocket closed without opened"
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            // Real WebSockets (e.g. Supabase Realtime) pass straight through
            if (urlStr.indexOf('supabase.co') !== -1) {
              return new RealWebSocket(url, protocols);
            }

            // Vite dev server HMR dummy socket
            var listeners = {};
            var dummy = {
              url: urlStr,
              readyState: 1, // WebSocket.OPEN
              send: function() {},
              close: function() {},
              addEventListener: function(type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(function() {
                    try { fn({ type: 'open' }); } catch(e) {}
                  }, 10);
                }
              },
              removeEventListener: function(type, fn) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                }
              },
              dispatchEvent: function() { return true; },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
            };

            setTimeout(function() {
              try {
                if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
              } catch(e) {}
            }, 10);

            return dummy;
          };

          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        function isIgnorableNetworkError(errOrMsg) {
          if (!errOrMsg) return false;
          var text = '';
          try {
            if (typeof errOrMsg === 'string') {
              text = errOrMsg;
            } else if (errOrMsg.message || errOrMsg.stack || errOrMsg.reason) {
              text = (errOrMsg.message || '') + ' ' + (errOrMsg.stack || '') + ' ' + (errOrMsg.reason || '');
            } else {
              text = String(errOrMsg);
            }
          } catch(e) {
            text = String(errOrMsg);
          }
          text = text.toLowerCase();
          return (
            text.indexOf('websocket') !== -1 ||
            text.indexOf('closed without opened') !== -1 ||
            text.indexOf('failed to connect to websocket') !== -1 ||
            text.indexOf('failed to fetch') !== -1 ||
            text.indexOf('networkerror') !== -1 ||
            text.indexOf('aborted') !== -1 ||
            text.indexOf('realtime') !== -1
          );
        }

        // Intercept unhandled rejections at the very highest capture level
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event && event.reason;
            if (isIgnorableNetworkError(reason)) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
              return false;
            }
          } catch(err) {}
        }, true);

        // Intercept global errors
        window.addEventListener('error', function(event) {
          try {
            var target = event && (event.message || event.error);
            if (isIgnorableNetworkError(target)) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
              return false;
            }
          } catch(err) {}
        }, true);

        // Clean up any vite-error-overlay dynamically
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
              mutation.addedNodes.forEach(function(node) {
                if (node && node.nodeName && node.nodeName.toLowerCase() === 'vite-error-overlay') {
                  node.remove();
                }
              });
            });
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-neutral-900 text-neutral-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
