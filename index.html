<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0D14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Korisko - Sistema de Gestão para Padaria</title>
    <meta name="description" content="Sistema de gestão da Padaria Korisko operando exclusivamente em Guaranis (₲ PYG) com PDV ágil, controle de estoque, comandas, fornadas quentes, caixa cego e proteção de segurança blindada." />
    <meta property="og:title" content="Korisko - Sistema de Gestão para Padaria" />
    <meta property="og:description" content="Sistema de gestão da Padaria Korisko operando exclusivamente em Guaranis (₲ PYG) com PDV ágil, controle de estoque, comandas, fornadas quentes, caixa cego e proteção de segurança blindada." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Bloqueio imediato de F12 e atalhos de desenvolvedor
        window.addEventListener('keydown', function(e) {
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault(); e.stopPropagation();
            try { console.clear(); } catch(err) {}
            return false;
          }
          var c = e.ctrlKey || e.metaKey;
          var k = (e.key || '').toUpperCase();
          if (c && e.shiftKey && (k === 'I' || k === 'J' || k === 'C' || k === 'K')) {
            e.preventDefault(); e.stopPropagation();
            try { console.clear(); } catch(err) {}
            return false;
          }
          if (c && e.altKey && (k === 'I' || k === 'J' || k === 'C')) {
            e.preventDefault(); e.stopPropagation();
            try { console.clear(); } catch(err) {}
            return false;
          }
          if (c && (k === 'U' || k === 'S')) {
            e.preventDefault(); e.stopPropagation();
            return false;
          }
        }, { capture: true, passive: false });

        // Bloqueio de botão direito do mouse (inspecionar elemento)
        window.addEventListener('contextmenu', function(e) {
          var t = e.target;
          if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
          e.preventDefault(); e.stopPropagation();
          return false;
        }, { capture: true, passive: false });

        // Silenciamento de rejeições não tratadas de WebSocket e conexões
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = (event && event.reason) ? (event.reason.message || String(event.reason)) : '';
            if (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('closed without opened') !== -1 ||
              reason.indexOf('failed to fetch') !== -1 ||
              reason.indexOf('NetworkError') !== -1 ||
              reason.indexOf('aborted') !== -1
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopPropagation) event.stopPropagation();
              return false;
            }
          } catch(err) {}
        });

        window.addEventListener('error', function(event) {
          try {
            var msg = (event && event.message) ? String(event.message) : '';
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopPropagation) event.stopPropagation();
              return false;
            }
          } catch(err) {}
        });

        // Limpeza de logs
        try {
          var noop = function() {};
          window.console.log = noop;
          window.console.info = noop;
          window.console.warn = noop;
          window.console.debug = noop;
          window.console.table = noop;
          window.console.clear();
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-900 text-neutral-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
